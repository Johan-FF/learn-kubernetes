deploymentMode: SingleBinary

singleBinary:
  replicas: 1

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  useTestSchema: true

# The memcached caches are not needed for a single-node course cluster and they do not fit
# comfortably next to the other workloads on this machine.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

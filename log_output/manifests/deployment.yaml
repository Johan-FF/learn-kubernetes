apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-devops-agent-0
      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: course-data
          persistentVolumeClaim:
            claimName: course-data-pvc
      containers:
        - name: writer
          image: log-output-writer:1.10
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_FILE
              value: /usr/src/app/files/output.txt
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: reader
          image: log-output-reader:1.11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: LOG_FILE
              value: /usr/src/app/files/output.txt
            - name: PING_FILE
              value: /usr/src/app/data/pingpong.txt
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
            - name: course-data
              mountPath: /usr/src/app/data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

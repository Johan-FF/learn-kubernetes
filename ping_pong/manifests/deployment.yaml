apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-devops-agent-0
      volumes:
        - name: course-data
          persistentVolumeClaim:
            claimName: course-data-pvc
      containers:
        - name: ping-pong
          image: ping_pong:1.11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: PING_FILE
              value: /usr/src/app/data/pingpong.txt
          volumeMounts:
            - name: course-data
              mountPath: /usr/src/app/data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

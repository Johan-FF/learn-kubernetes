apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: webhook-sink-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-sink
  template:
    metadata:
      labels:
        app: webhook-sink
    spec:
      containers:
        - name: webhook-sink
          image: webhook_sink:4.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

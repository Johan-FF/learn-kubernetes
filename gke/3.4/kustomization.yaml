apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Exercise 3.4: same Gateway API routing, but the /pingpong prefix is rewritten to / before the
# request reaches the "Ping-pong" application.
resources:
  - ../base
  - ../3.3/gateway.yaml
  - httproute.yaml

patches:
  - target:
      kind: Service
      name: ping-pong-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
  - target:
      kind: Service
      name: log-output-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort

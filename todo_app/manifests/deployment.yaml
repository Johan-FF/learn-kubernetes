apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-cache-pvc
      containers:
        - name: todo-app
          image: todo_app:2.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: todo-app-config
          env:
            - name: PORT
              value: "3000"
            - name: CACHE_DIR
              value: /usr/src/app/cache
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/cache
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

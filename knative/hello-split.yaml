apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: default
spec:
  # 50/50 between the revision that this file creates and the revision from hello.yaml.
  traffic:
    - percent: 50
      latestRevision: true
      tag: v2
    - percent: 50
      revisionName: hello-00001
      tag: v1
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      containers:
        - image: greeter:v1
          env:
            - name: GREETER_VERSION
              value: v2
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi

name: build

on:
  push:
    branches:
      - "**"
    paths:
      - "todo_app/**"
      - "todo_backend/**"
      - "todo_generator/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.GCP_REGISTRY }}
  TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet

      - name: Build and push the images
        run: |
          set -e
          docker build -t "$REGISTRY/todo-app:$TAG" todo_app
          docker build -t "$REGISTRY/todo-backend:$TAG" todo_backend
          docker build -t "$REGISTRY/todo-generator:$TAG" todo_generator
          docker push "$REGISTRY/todo-app:$TAG"
          docker push "$REGISTRY/todo-backend:$TAG"
          docker push "$REGISTRY/todo-generator:$TAG"

      - name: Summary
        run: |
          {
            echo "### Images built"
            echo ""
            echo '```'
            echo "$REGISTRY/todo-app:$TAG"
            echo "$REGISTRY/todo-backend:$TAG"
            echo "$REGISTRY/todo-generator:$TAG"
            echo '```'
            echo ""
            echo "Deployment happens from https://github.com/Johan-FF/learn-kubernetes-config,"
            echo "where this tag is promoted (see exercise 4.10)."
          } >> "$GITHUB_STEP_SUMMARY"

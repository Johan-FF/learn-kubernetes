name: deploy

on:
  push:
    branches:
      - "**"
    paths:
      - "todo_app/**"
      - "todo_backend/**"
      - "todo_generator/**"
      - "project/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.GCP_REGISTRY }}
  TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet

      - name: Build and push the images
        run: |
          set -e
          docker build -t "$REGISTRY/todo-app:$TAG" todo_app
          docker build -t "$REGISTRY/todo-backend:$TAG" todo_backend
          docker build -t "$REGISTRY/todo-generator:$TAG" todo_generator
          docker push "$REGISTRY/todo-app:$TAG"
          docker push "$REGISTRY/todo-backend:$TAG"
          docker push "$REGISTRY/todo-generator:$TAG"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GCP_ZONE }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Choose the environment namespace
        id: env
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            NS=project
          else
            NS=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]_/' '[:lower:]--')
          fi
          echo "namespace=$NS" >> "$GITHUB_OUTPUT"
          echo "deploying to namespace $NS"

      - name: Point the overlay at the environment and the built images
        working-directory: project/overlays/gke
        run: |
          kustomize edit set namespace "${{ steps.env.outputs.namespace }}"
          kustomize edit set image "todo-app=$REGISTRY/todo-app:$TAG"
          kustomize edit set image "todo-backend=$REGISTRY/todo-backend:$TAG"
          kustomize edit set image "todo-generator=$REGISTRY/todo-generator:$TAG"

      - name: Deploy
        run: kubectl apply -k project/overlays/gke

      - name: Wait for the rollout
        run: |
          NS="${{ steps.env.outputs.namespace }}"
          kubectl rollout status deployment/todo-app-dep -n "$NS" --timeout=300s
          kubectl rollout status deployment/todo-backend-dep -n "$NS" --timeout=300s

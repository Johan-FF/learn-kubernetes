apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-analysis
  namespace: exercises
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-analysis
  namespace: exercises
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-analysis
  namespace: exercises
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollout-analysis
subjects:
  - kind: ServiceAccount
    name: rollout-analysis
    namespace: exercises
